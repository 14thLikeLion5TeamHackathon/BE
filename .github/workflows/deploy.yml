name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/madi
            git fetch origin
            git checkout main
            git reset --hard origin/main
            set_env() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }
            set_env OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
            set_env GOOGLE_CLIENT_ID "${{ secrets.GOOGLE_CLIENT_ID }}"
            set_env GOOGLE_CLIENT_SECRET "${{ secrets.GOOGLE_CLIENT_SECRET }}"
            set_env KAKAO_CLIENT_ID "${{ secrets.KAKAO_CLIENT_ID }}"
            set_env KAKAO_CLIENT_SECRET "${{ secrets.KAKAO_CLIENT_SECRET }}"
            docker compose up -d --build
            docker image prune -f
